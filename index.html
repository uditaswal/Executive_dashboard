<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>Payments Dashboard</title>
    <link rel='stylesheet' href='css/style.css'>
    <script src='https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
</head>

<body>
    <header class='top'>
        <div id='title'>Payments Dashboard</div>
        <div id='count'>0 records</div>
    </header>
    <div class='layout'>
        <aside class='side'>
            <h3>Filters</h3>
            <input type='file' id='fileInput' accept='.xlsx,.xls,.csv'>
            <select id='fMonth'>
                <option value=''>All Month</option>
            </select>
            <select id='fPartner'>
                <option value=''>All Partner</option>
            </select>
            <select id='fStatus'>
                <option value=''>All Status</option>
            </select>
            <select id='fPriority'>
                <option value=''>All Priority</option>
            </select>
            <select id='fRegion'>
                <option value=''>All Region</option>
            </select>
            <input id='search' placeholder='Search...'>
            <button id='btnLoad'>Auto Load</button>
            <button id='btnApply'>Apply</button>
            <button id='btnReset'>Reset</button>
        </aside>
        <main class='main'>
            <div class='tabs'>
                <button class='tab active' data-view='overview'>Overview</button>
                <button class='tab' data-view='analytics'>Analytics</button>
                <button class='tab' data-view='incidents'>Incidents</button>
            </div>
            <section id='overview' class='view'>
                <div class="card summary-box">
                    <h3>Executive Summary</h3>
                    <p id="execSummary"></p>
                </div>
                <br>
                <div class="card section-box">
                    <h3>KEY PERFORMANCE INDICATORS</h3>
                    <div id="kpis" class="grid"></div>
                </div>
                <br>

                <div class="card section-box">
                    <h3>Metrics Summary</h3>

                    <table class="metrics-table">
                        <thead>
                            <tr>
                                <th>Metric</th>
                                <th>Value</th>
                                <th>Notes</th>
                            </tr>
                        </thead>

                        <tbody id="metricsBody"></tbody>
                    </table>
                </div>
                <br>
                <div id='kpis' class='grid'></div>
                <br>

                <div class="card section-box">
                    <h3>SUGGESTIONS</h3>
                    <ul id="suggestions"></ul>
                </div>


            </section>
            <section id='analytics' class='view hide'>
                <div class="filter-bar">
                    <div class="filter-title">Month Filter</div>
                    <div class="filter-group">
                        <label>
                            <input type="checkbox" id="mAll" checked>
                            <span class="filter-pill">All</span>
                        </label>
                        <label>
                            <input type="checkbox" class="mchk" value="Jan">
                            <span class="filter-pill">Jan</span>
                        </label>
                        <label>
                            <input type="checkbox" class="mchk" value="Feb">
                            <span class="filter-pill">Feb</span>
                        </label>
                        <label>
                            <input type="checkbox" class="mchk" value="Mar">
                            <span class="filter-pill">Mar</span>
                        </label>
                        <label>
                            <input type="checkbox" class="mchk" value="Apr">
                            <span class="filter-pill">Apr</span>
                        </label>
                    </div>
                </div>
                <div class='charts'>
                    <div class='card wide'><canvas id='c1'></canvas></div>
                    <div class='card'><canvas id='c2'></canvas></div>
                    <div class='card'><canvas id='c3'></canvas></div>
                </div>
                <br>
                <div class='charts'>
                    <div class='card wide'><canvas id='c4'></canvas></div>
                    <div class='card wide'><canvas id='c10'></canvas></div>
                    <div class='card'><canvas id='c12'></canvas></div>
                    <div class='card'><canvas id='c13'></canvas></div>
                    <div class='card wide'><canvas id='c14'></canvas></div>
                    <div class='card wide'><canvas id='c15'></canvas></div>
                    <div class='card'><canvas id='c16'></canvas></div>
                    <div class='card'><canvas id='c17'></canvas></div>
                </div>

                <div class="card chart-card tall">
                    <canvas id="c11"></canvas>
                </div>

            </section>
            <section id='incidents' class='view hide'>
                <table>
                    <thead>
                        <tr>
                            <th>Incident</th>
                            <th>Month</th>
                            <th>Partner</th>
                            <th>Status</th>
                            <th>P</th>
                        </tr>
                    </thead>
                    <tbody id='tbody'></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src='js/data.js'></script>
    <script src='js/filters.js'></script>
    <script src='js/charts.js'></script>
    <script src='js/views.js'></script>
    <script src='js/app.js'></script>
</body>

</html>
