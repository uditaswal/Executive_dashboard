<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incident Shot</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; }
    body { background: #f5f6fa; }
  </style>
</head>
<body>
  <iframe id="app" src="/index.html"></iframe>
  <script>
    const frame = document.getElementById("app");
    frame.addEventListener("load", () => {
      const timer = setInterval(() => {
        const win = frame.contentWindow;
        if (!win || !win.APP || !win.APP.DATA || !win.APP.DATA.length) {
          return;
        }
        clearInterval(timer);
        win.APP.view("analytics");
        win.APP.setAnalyticsMode("tables");
      }, 800);
    });
  </script>
</body>
</html>
